[project]
name = "ma3-copilot-server"
version = "0.1.0"
description = "grandMA3 AI copilot server (SPEC-COPILOT-MVP-001) - OSC bridge, tool runner, safety gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.115",
    "google-genai>=2.12.0",
    "python-osc>=1.9.3,<2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "lupa>=2.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.coverage.report]
show_missing = true
