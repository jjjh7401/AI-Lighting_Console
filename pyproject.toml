[project]
name = "ma3-copilot-server"
version = "0.1.0"
description = "grandMA3 AI copilot server (SPEC-COPILOT-MVP-001) - OSC bridge, tool runner, safety gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.115",
    "google-genai>=2.12.0",
    # SPEC-LDSTORE-001 M1: Director 교환 객체를 계약이 규범으로 지정한 JSON Schema
    # (SPEC-LDPLUGIN-001/schemas/exchange.schema.json, draft 2020-12)로 검증한다.
    # 손으로 재구현하면 계약이 금지한 두 번째 wire 원본이 생긴다. format-nongpl 변종은
    # date-time 검사(rfc3339-validator)를 GPL 없이 제공한다 — 계약 §11 이 format checker
    # 없는 validator 로는 date-time 이 보장되지 않는다고 경고한다.
    "jsonschema[format-nongpl]>=4.23",
    # SPEC-LDSTORE-001 M1: 계약 §9 가 모든 JSON digest 를
    # sha256(UTF-8(RFC8785/JCS(value))) 로 규정한다. digest 는 외부 플러그인이 같은
    # 값을 계산해야 하는 wire 계약이므로 근사하면 안 된다 — stdlib json 은 JCS 가
    # 아니다(정수값 float 을 `1.0` 으로 쓰고 JCS 는 `1` 로 쓴다, 실측 확인).
    # 계약의 합성 예제 digest 를 시험 벡터로 쓴다.
    "rfc8785>=0.1.4",
    # M7: embedded Lua 5.4 for the deploy_plugin pcall compile harness
    # (REQ-MVP-019) — promoted from the dev group (ratification item).
    "keyring>=25,<26",
    "librosa>=0.11.0",
    "lupa>=2.8",
    # SPEC-COPILOT-VWX-001 M1: Vectorworks Export Worksheet .xlsx binary
    # format parsing (Kickoff Approval — openpyxl adopted, v0.1.1).
    "openpyxl>=3.1",
    "python-osc>=1.9.3,<2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34",
    "websockets>=14",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    # packaging/build.sh:36 이 `"$PY" -m PyInstaller` 로 데스크톱 번들을 만드는데,
    # :12 는 .venv 에 PyInstaller 가 이미 있음을 **전제로 적고 스스로 설치하지 않는다**.
    # 선언이 없으면 `uv sync` 가 걷어내 데스크톱 빌드가 깨진다 (2026-09-14 실측:
    # SPEC-LDSTORE-001 M1 작업 중 실제로 깨졌고 `uv pip install --python
    # .venv/bin/python pyinstaller` 로 수동 복구했다 — 그 SPEC 의 progress.md 가
    # 「이 SPEC 이 만든 문제가 아니라 드러낸 문제」로 기록해 두었다).
    # uv 는 dev 그룹을 기본으로 설치하므로 여기 두면 sync 가 유지한다.
    "pyinstaller>=6.22",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
# t52 — 열거하지 못한 대기까지 덮는 그물. 의존성 0(pytest 내장).
#
# 임계값의 근거: 전량 --durations=20 실측에서 최장 테스트가 7.42s 였고
# 상위 5개가 5초대, 6위가 1.79s 로 뚝 떨어졌다. 60s 는 그 최장의 8배다.
#
# 🔴 그 7.42s 는 load averages 4.89~4.99 에서 잰 값이다. 한가한 CI 러너에서는
# 더 짧을 테니 이 임계값은 **CI 에서 더 느슨하다**. 느슨한 그물이라도 없는
# 것보다 낫지만, 느슨한 줄 모르고 쓰지 않도록 여기 적어 둔다. 부하가 크게
# 다른 환경으로 옮기면 --durations 를 다시 재고 이 값을 다시 정할 것.
#
# 행(hang)과 느림을 가르는 값이면 된다 — 행은 무한이므로 최장보다 크게만
# 잡으면 잡힌다. exit_on_timeout 은 프로세스를 통째로 끊으므로 임계값이
# 측정으로 선 뒤에만 켠다(t52 §5b 6단계).
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

[tool.ruff]
target-version = "py311"
line-length = 100
# 경로를 명시적으로 넘겨도 제외를 적용한다 — PRESERVE 게이트 테스트
# (`test_ruff_format_reports_no_change`)가 파일 목록을 인자로 넘기기 때문이다.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# t115 — 게이트가 이 11개를 **못 보던** 자리다(`git diff --name-only` 가 비ASCII
# 경로를 따옴표로 감싸 `is_file()` 이 전부 떨어뜨렸다). 게이트를 고쳐 보이게 만든
# 뒤, 이미 쌓여 있던 위반은 **파일별로 명시 유예**한다. 조용한 무검사를 밝은
# 유예로 바꾸는 것이 이 카드의 전부이고, 유예를 없애는 것은 후속 카드다.
#
# @MX:DEBT: 빌드파이프라인 11개 파일의 기존 ruff 위반을 파일별로 유예한다
# @MX:CEILING: 여기 적힌 (파일, 규칙) 85쌍. 그 밖의 위반은 유예 없이 잡힌다
# @MX:UPGRADE: 후속 카드가 규칙별로 실제 수정하며 이 목록을 줄인다. 목록이
#   비면 이 절과 아래 format exclude 를 통째로 지운다
#
# [HARD] 디렉터리 글롭을 쓰지 마라. 글롭이면 이 폴더에 **새로 생기는 파일이
# 첫날부터 유예 상태**가 된다 — 그게 지금 고치고 있는 결함의 재생산이다.
# 파일 단위면 새 파일은 처음부터 전량 린트를 받는다. 목록이 늘지 않는 것은
# `test_overlap_preserve.py` 의 증가금지 검사가 지킨다.
[tool.ruff.lint.per-file-ignores]
"src/Lighting_Designer/90_빌드파이프라인/exec_data.py" = ["E501"]
"src/Lighting_Designer/90_빌드파이프라인/make_exec.py" = ["E402", "E501", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/make_ma3.py" = ["E402", "E501", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/make_rig.py" = ["E501", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/make_timeline.py" = ["E402", "E501", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/make_xlsx.py" = ["E402", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/rig_data.py" = ["E501"]
"src/Lighting_Designer/90_빌드파이프라인/seq_data.py" = ["E501", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/validate_ma3.py" = ["E402", "UP031"]
"src/Lighting_Designer/90_빌드파이프라인/validate_rig.py" = ["UP031"]
"src/Lighting_Designer/90_빌드파이프라인/validate.py" = ["E402", "UP031"]

# PRESERVE 핀 파일은 **포매터에서만** 제외한다 (lint는 그대로 받는다).
# `server/web/preview.py`는 SPEC-COPILOT-PRECHK-001/OVERLAP-001이 바이트
# 동일성을 요구하는 핀 파일인데, 저장소 전역 `ruff format`이 4행
# 컴프리헨션을 1행으로 접어 핀을 두 번 깨뜨렸다 (원복 커밋 6d0b58c, 그리고
# 재발해 이 커밋이 다시 원복한다). 의미는 동일하고 핀의 가치는 바이트
# 동일성 자체이므로, 포매터가 이 파일을 건드리지 않게 하는 것이 재발을
# 끊는 최소 조치다.
[tool.ruff.format]
exclude = [
    "server/web/preview.py",
]

[tool.coverage.report]
show_missing = true
