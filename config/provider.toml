# LLM provider configuration (SPEC-COPILOT-MVP-001, REQ-MVP-006/039/040/041).
#
# - Exactly ONE active provider at runtime; switch by editing `active` below —
#   no code change required (AC-MVP-026).
# - Model pins: Anthropic is pinned to claude-opus-4-8 (REQ-MVP-006).
#   The Gemini pin is the latest documented STABLE (non-preview) GA model,
#   web-verified against ai.google.dev/gemini-api/docs/models on 2026-07-16
#   (user decision at the M3 check-in); config-changeable without code change.
# - SECURITY: this file must NEVER contain credentials. API keys are injected
#   via environment variables only: ANTHROPIC_API_KEY, GEMINI_API_KEY (or
#   GOOGLE_API_KEY). The loader rejects credential-like keys.

[provider]
# M6b-3 default-provider selection (2026-07-18 human check-in — REQ-MVP-040):
#   Gemini selected. Rationale: Gemini is the ONLY measured candidate — pooled
#   grammar error rate 0.40% (< 5% threshold, AC-MVP-002 PASS, M6b-1r2 after
#   rulebook reinforcement). Anthropic was NOT measured (no ANTHROPIC_API_KEY
#   available), so the AC-002-AND-AC-003 eligibility predicate could not be
#   evaluated for it. AC-003 (round-trip median < 10s) with the full LLM path
#   is NOT yet live-measured — a deferred onPC gap (the raw OSC transport IS
#   live-verified, M6b-2 PASS). See progress.md §E.2 M6b-3.
active = "gemini"

[provider.anthropic]
model = "claude-opus-4-8"
prompt_caching = true
max_tokens = 16000
# Fixed, recorded inference settings (grammar error-rate measurement requires
# a pinned production inference configuration — acceptance.md measurement §5).
thinking = "adaptive"
effort = "high"

[provider.claude_code]
# Claude Pro/Max/Teams 구독 OAuth는 로컬 Claude Code가 macOS Keychain에서 관리합니다.
# 이 파일에는 OAuth 토큰이나 API 키를 기록하지 않습니다.
model = "sonnet"

[provider.gemini]
model = "gemini-3.5-flash"
context_caching = true
cache_ttl_seconds = 3600

[provider.ollama]
# 로컬 오프라인 백업 (SPEC-COPILOT-LOCALLM-001). 인터넷도 API 키도 없는
# 공연장에서 쓰는 경로다. 쓰려면 위 `active`를 "ollama"로 바꾸고 재시작한다.
#
# 선정 근거 (2026-08-20 실측, M5 Pro / onPC 2.4.2):
#   - 문법 오류율 pooled 0.00% = 0/188 라인 (AC-MVP-002 임계 5%) — 판정 통과
#   - 도구 선택 14/14, 반복 3회 동일
#   - 도구 판단 응답 중앙값 0.95초 (Gemini 2.92초)
#   - 26B A4B(활성 4B MoE)라 12B 밀집 모델보다 빠르고 정확했다
# 주의: 위 오류율은 mock 콘솔 기준이다. 실기 명령 수용은 별도 검증 대상이다.
model = "gemma4:26b"
host = "http://127.0.0.1:11434"
# 콜드 프롬프트가 54초다(28k 토큰 프리픽스 실측). 언로드되면 다음 턴이 그
# 54초를 다시 낸다. 길게 잡으면 약 17GB가 상주하고, 짧게 잡으면 메모리를
# 돌려주는 대신 그 1분을 다시 지불한다.
keep_alive = "60m"

# REQ-MVP-040(ii) persistent-miss fallback detection (AD2-m1 defaults N=20/M=2).
[fallback]
window_turns = 20
consecutive_windows = 2
threshold_seconds = 10.0
# target_provider = "anthropic"
# ^ With active=gemini (M6b-3), the only possible fallback target is Anthropic,
#   which remains UNMEASURED (no ANTHROPIC_API_KEY). Left unset: a persistent-
#   miss trigger is decided + audit-logged only; no provider switch is performed
#   (AC-MVP-027 part 3). Do NOT uncomment until Anthropic-side error-rate +
#   round-trip measurement exists and confirms it is a viable fallback.
