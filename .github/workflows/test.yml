# 이 저장소에는 테스트 CI 가 없었다. PR #74~#85 열두 건이 연속으로
# reviews=0 checks=0 으로 머지됐고, 외부 감사가 결함 9건을 찾은 자리가 거기다.
#
# 범위는 최소다 — pytest 전량 + vitest 전량. 실측 근거는 커밋 메시지에 있다.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 러너는 UTC 다. UI 테스트가 화면에 찍히는 현지 시각을 단언하는데
    # (CueMonitor 이력 행), 개발 기계가 KST 라 UTC 에서는 09:00:00 이
    # 00:00:00 로 나와 깨졌다. 테스트의 의미를 바꾸는 대신 CI 가 개발
    # 환경을 재현하게 한다.
    env:
      TZ: Asia/Seoul

    steps:
      # fetch-depth 0 이 필요하다. 이 저장소의 PRESERVE 계열 테스트가
      # git diff <고정 SHA>..HEAD 로 불변식을 검사하는데, 기본 얕은
      # 클론에는 그 SHA 가 없어 git 이 exit 128 로 죽는다(첫 CI 실행에서
      # 34건이 그 이유로 깨졌다).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 파이썬 버전은 저장소의 .python-version(3.11.15)을 그대로 따른다.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install ui dependencies
        run: npm --prefix ui ci --no-audit --no-fund

      # 빌드는 2초대이고(로컬 실측 2.19s), 그 대가로 가이드 신선도 검사 2건이
      # skip 에서 실제 단언으로 바뀐다. 빌드가 없으면 그 둘은 매 실행 skip 이다.
      - name: Build ui
        run: npm --prefix ui run build

      - name: Python tests
        # -rs 가 필요하다. -q 만 쓰면 skip 이 개수로만 남고 어느 검사가
        # 왜 안 돌았는지가 사라진다 — return 을 pytest.skip 으로 바꾼 값이
        # 바로 그 출력이었는데 -q 가 그것을 다시 지운다.
        run: uv run pytest -q -rs

      - name: UI tests
        run: npm --prefix ui run test
