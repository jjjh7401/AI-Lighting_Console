# Safety-gate closed sets — SINGLE SOURCE OF TRUTH (REQ-MVP-013 / REQ-MVP-026).
#
# Both sets below are CLOSED sets: they change ONLY via a revision of this file
# with a version bump (open-ended lists are prohibited by spec). Tests iterate
# this file's content directly, so a revision here auto-extends the FN corpora.
#
# - blacklist: commands that are NEVER executed without human approval
#   (REQ-MVP-013/014 — no exception via any route).
# - invoking_verbs: reference-invoking command forms subject to the
#   expand-or-hold rule (REQ-MVP-026): target bodies are fetched and
#   classified; unverifiable references are held for human approval.
#
# REVISION HISTORY (the version field below is the ratification record):
#   v1 -> v2  SPEC-COPILOT-WRITEGATE-001 adds "Set Fixture". FIRST revision of
#     this literal in the repository's history; the procedure this header has
#     always specified now has one execution, weighted the same as
#     SPEC-COPILOT-EXECREF-001's RECOGNIZED_REFERENCE_TYPES revision
#     (`classify.py` @MX:NOTE). A false-negative OBSERVATION backs it, not a
#     review: SPATIAL-001 progress.md §E.2.20 recorded 54 unrequested fixture
#     coordinate writes reaching the console with no approval card and no
#     showfile snapshot, because `Set Fixture <fid> Pos* '<v>'` classified
#     "safe". The same turn's `Go+ Page 1.202` DID raise a card -- the gate was
#     healthy and only writes slipped the net.
#   v2 -> v3  SPEC-COPILOT-RESTORE-001 (preparatory) adds "LoadShow" and
#     "NewShow". SHOWFILE REPLACEMENT had zero coverage: the six v1 entries are
#     object/system scoped and v2's is a patch write, so a command that
#     discards the entire live show classified "safe" and executed with no
#     approval card. This is the SAME false-negative shape v2 was ratified for
#     -- writes slipping a healthy gate -- and it is strictly worse here,
#     because there is no way back: `backup.py` retains snapshots but there is
#     no restore SEND path (`gate.py` @MX:NOTE), and `BACKUP_COMMAND` is a bare
#     `SaveShow` that overwrites one file, so N snapshots address 1 showfile.
#     A wrongly-loaded show is unrecoverable by this application today.
#
#     MEASURED cost (the `_would_be_held` over `load_corpus()` procedure v2
#     established): 35 command lines across 17 scenarios, and BOTH entries add
#     **0 newly-blacklisted lines and 0 scenarios**. The repository contains no
#     MA3 `Load`/`New` command line at all -- rulebook, corpus and tests are
#     0 hits -- so no canonical SAFE fixture collides the way `Store Group 3`
#     did for DEPLOY.
#
#     KNOWN FUTURE COLLATERAL, stated because 0 measured is not 0 forever:
#     `_keyword_match` is abbreviation-aware in the direction
#     command-token -> entry-keyword, so entry "LoadShow" also matches a bare
#     `Load ...` verb and "NewShow" a bare `New ...`. MA3's `Load Cue <n>`
#     (load a cue into the programmer) is benign and WILL raise a card once
#     this application starts using it. That is the designed direction
#     (over-match, see the `Set Fixture` note below) and the cost is one
#     approval, not a refusal.
#
#     SCOPE, stated precisely: the exact MA3 keyword for a show reload is
#     UNVERIFIED (`gate.py` @MX:NOTE says so). These two literals mirror
#     `SaveShow`, which IS verified -- production backup sends it and reads a
#     confirmed outcome. Blacklisting under that uncertainty is safe in the
#     only direction that matters: if the real keyword differs, this entry
#     costs nothing and the hole stays open, so a live calibration must still
#     confirm the vocabulary. It is a floor, not a proof of closure.
#     `Import` is deliberately NOT here -- it is pool data import, not showfile
#     replacement, and the plugin deploy path depends on it.
version: 3

blacklist:
  - "Delete"
  - "Remove"
  - "Off Everything"
  - "Store /overwrite"
  - "Shutdown"
  - "Format"
  # A fixture's patch row is SHOWFILE STATE, and every write to it needs a
  # human. Deliberately the OBJECT and not the property: enumerating
  # `Posx`/`Posy`/`Posz`/`Rotx`/... would be the open-ended list this file's
  # header prohibits, and it would invite "what about the next property?".
  #
  # SCOPE OF THAT CLAIM, stated precisely because "closed and complete" is
  # easy to over-read: this entry closes the PROPERTY dimension. It is keyed on
  # one VERB (`Set`) and one ADDRESS keyword (`Fixture`), and neither of those
  # two dimensions was varied by the evidence behind it. Candidate escapes that
  # parse cleanly and classify `safe` today: `Edit|Assign|Change|Update Fixture
  # 11 Posx '5.0'`, `Set Stage 1.Fixtures.1 Posx '5.0'`, `Set Fixtures 11 Posx
  # '5.0'` (plural is not a prefix of `Fixture`), `Set Posx '5.0'`. None is
  # established as MA3-accepted -- the rulebook documents no patch-write
  # command line at all -- so they are unproven candidates, not known holes.
  # The working assumption is that `Set` is the only patch-write verb; if that
  # is ever falsified, this entry is incomplete and the fix is another revision.
  #
  # Over-matching here is the designed direction (`classify.py` module
  # docstring): a non-coordinate patch write such as `Set Fixture 11 Name
  # 'Spot 11'` also raises a card, and that is correct -- it is still a
  # showfile mutation. Under-matching would be a safety false negative.
  #
  # Scoped to `Set Fixture` ON PURPOSE. `Store Group` is NOT here. MEASURED
  # cost of taking it (with this file's own `_would_be_held` predicate over
  # `load_corpus()`): entry `Store` collides with the measurement corpus's
  # "non-risky verbs only" invariant in 10 of 21 scenarios (5 of 10
  # representative task types); entry `Store Group` in 3 of 21 (1 of 10). It
  # also breaks exactly 3 DEPLOY tests that use `Store Group 3` as their
  # canonical SAFE fixture. An earlier draft of this comment said "13 of 21
  # (7 of 10)" -- that was a count of write-bearing COMMANDS under a broad
  # `Store|Set|Assign|Copy` regex, restated as `Store`'s scenario count. The
  # descope still holds on the corrected numbers (`group_create` is 1 of the
  # AC-MVP-001 ten representatives, and the DEPLOY collision is independent of
  # corpus size), but the cost of the alternative was overstated and is not.
  # Descoped by user decision 2026-08-05; a follow-up SPEC owns it and inherits
  # the procedure this revision establishes.
  - "Set Fixture"
  # SHOWFILE REPLACEMENT (v3). Both discard the console's entire live show, and
  # unlike every other entry here that loss is UNRECOVERABLE by this
  # application: snapshots are retained but no restore SEND path exists
  # (`gate.py` @MX:NOTE), and `BACKUP_COMMAND` is a bare `SaveShow`, so N
  # snapshots address exactly 1 file. Approval is the only barrier there is.
  #
  # Two literals rather than one because the shape is unverified and they do
  # NOT cover for each other: `_keyword_match` matches command-token ->
  # entry-keyword, so entry "LoadShow" catches `LoadShow`/`Load`, and entry
  # "Load Show" would catch the two-token form but NOT the single token. The
  # single-token spelling is the strong prior — `SaveShow`, the one member of
  # this family this repository has actually executed, is one token.
  - "LoadShow"
  - "NewShow"

invoking_verbs:
  verbs:
    - "Go"
    - "Go+"
    - "Go-"
    - "Goto"
    - "On"
    - "Off"
    - "Toggle"
    - "Temp"
    - "Flash"
    - "Call"
  bare_object_forms:
    - "Macro <n>"
    - "Plugin <n>"
