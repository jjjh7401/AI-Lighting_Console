# 외부 효과 라이브러리(lighting_effect_library_v1_1.json) ID → 앱 자산 대응표.
#
# 이름·설명이 같은지로만 맞춘 표다(match_basis: name_only). 실콘솔에서 같은 모양으로
# 보이는지는 확인하지 않았다(console_verified: false). 이 두 표시는 실측 전에 바꾸지 않는다.
#
# ref.kind 어휘:
#   fx            — server/fx/library/*.yaml 의 fx_id
#   dimmer_phaser — server/design/phaser_catalog.py DIMMER_PHASER_SEQUENCE 라벨
#   color_phaser  — 같은 파일 COLOR_PHASER_SEQUENCE 라벨
#   combo_phaser  — 같은 파일 COMBO_PHASER_SEQUENCE 라벨
#   cell_kind     — server/design/cell_direction.py EFFECT_KINDS
#   position_fx   — server/spatial/position_fx.py POSITION_FX_EFFECTS
# similarity: same(모양과 쓰임이 같다고 읽힘) | similar(가깝지만 값·파형이 다름)
#
# 열린 PR #838·#840 의 웨이브 프리셋은 main 에 없어서 여기 넣지 않았다.

schema_version: 1
match_basis: name_only
console_verified: false

entries:
  - library_id: DIM-01
    refs:
      - {kind: fx, id: pulse-sine-breath, similarity: same}
      - {kind: dimmer_phaser, id: Breathe Deep, similarity: similar}
  - library_id: DIM-03
    refs:
