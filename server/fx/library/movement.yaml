# Built-in fx library — movement phasers (REQ-FXLIB-002).
#
# The four unconditional patterns: sweep, wave, circle, diagonal. All four are
# unconditional VOCABULARY (spec.md §A) but their EFFECT is not measured — M0
# watched a phaser get built, stored and replayed on the intensity axis only,
# and whether the same two-step shape generalises to the position axes is
# ASSUMPTION-40, judged at M7. That is why these four sit in their own file: if
# M7 comes back NEGATIVE the cost is bounded to this file, and dimmer.yaml (the
# measured anchor) still proves the pipeline end to end.
#
# AUTHORING RULES — shared by every asset in this directory:
#
#   * Two steps minimum, and every step names the same attribute set. The steps
#     CREATE the phaser; phase and speed only reshape one that already exists,
#     so a one-step entry is accepted line by line and leaves the stage still.
#   * Step values are absolute numbers, and no attribute may repeat a value
#     inside one entry. A repeated value emits an identical command line, the
#     dedupe drops the second one, and the phaser silently loses a step.
#   * Amplitude is the DIFFERENCE between step values. Since the 2026-08-15
#     live session an entry may instead set `relative: true`, which emits every
#     step value as `At Relative <n>` — measured to sweep around the fixture's
#     CURRENT position (SPEC-COPILOT-FXGEN-001 spec.md §A, V2).
#   * No rig binding of any kind, and no command lines. Both arrive later.
#   * Speed is BPM (ASSUMPTION-38 GO, read off the console display). The seeds
#     come from the rulebook mood table (31_choreography_patterns.md:236-241):
#     10-20 for warm / ballad / intimate, 90-180 for energetic / club / party.
#     Under a BPM reading those two bands land on musical tempo, which is what
#     makes them usable as seeds at all. The table's third row, "dramatic /
#     accelerating", has no entry here: acceleration is the curve axis, and M0
#     got acceptance with no observed effect from it, so v1 leaves it empty.
#
# THE POSITION MAGNITUDES ARE DELIBERATELY SMALL. The repository carries no
# measured unit for a bare position value — percent and degrees are both
# consistent with what is on record — so these follow the magnitudes in
# design.md §4.1/§4.2 rather than inventing a wider swing. If the unit turns
# out to be percent, a large number sweeps beams across the whole room; keeping
# them modest costs a little travel and no safety.
#
# WHY VALUES DIFFER BETWEEN NEIGHBOURING ENTRIES. For variety only. It buys no
# collision safety: every pattern emits the same step-transition line, so two
# instantiations in one instruction turn collide no matter what values are
# authored (design.md §4.3). The boundary is stated, not evaded.
schema_version: 1

fx:
  # --- sweep — the pan axis --------------------------------------------------
  - fx_id: "sweep-soft-wide"
    display_name: "부드러운 좌우 스윕"
    pattern: "sweep"
    aliases: ["좌우 스윕", "부드러운 스윕", "좌우로 쓸어줘", "무빙 살랑살랑", "빔 천천히 흔들어", "soft sweep"]
    mood_keywords: ["부드러운", "느린", "잔잔한", "넓은", "발라드", "살랑살랑", "soft", "slow", "sweep"]
    steps:
      - Pan: -30
      - Pan: 30
    phase_from: 0
    phase_to: 360
    speed: 14

  # The phase spread here comes from rig geometry rather than selection order —
  # one wave across the X axis (31_choreography_patterns.md:85-86). It reads
  # differently on stage than the entry above, which fans the phase across the
  # selection in whatever order the selection happens to be in.
  - fx_id: "sweep-club-xwave"
    display_name: "클럽 좌우 웨이브"
    pattern: "sweep"
    aliases: ["클럽 스윕", "빠른 스윕", "엑스축 웨이브", "빔 흔들어줘", "무빙 신나게 흔들어", "club sweep"]
    mood_keywords: ["빠른", "신나는", "클럽", "에너지", "파도", "흔드는", "fast", "club", "energetic"]
    steps:
      - Pan: -20
      - Pan: 20
    speed: 120
    phase_from_x: 0
    phase_to_x: 360

  # --- wave — the tilt axis --------------------------------------------------
  - fx_id: "wave-soft-rise"
    display_name: "부드러운 상하 웨이브"
    pattern: "wave"
    aliases: ["상하 웨이브", "웨이브", "부드러운 웨이브", "웨이브 태워줘", "파도 타게", "soft wave"]
    mood_keywords: ["부드러운", "느린", "물결", "잔잔한", "예배", "파도", "soft", "wave", "gentle"]
    steps:
      - Tilt: -12
      - Tilt: 12
    phase_from: 0
    phase_to: 360
    speed: 12

  # reverse walks the phase the other way round the circle. The pair of fields
  # is deliberate: the spread is still 0 to 360, and reverse is the boolean
  # parameter that flips its direction (spec.md §A — reverse is a parameter,
  # not a pattern of its own).
  - fx_id: "wave-fall-reverse"
    display_name: "내려오는 웨이브"
    pattern: "wave"
    aliases: ["내려오는 웨이브", "역방향 웨이브", "폭포", "위에서 쏟아지게", "떨어지는 웨이브", "reverse wave"]
    mood_keywords: ["내려오는", "역방향", "쏟아지는", "빠른", "폭포수", "reverse", "falling"]
    steps:
      - Tilt: 15
      - Tilt: -15
    phase_from: 0
    phase_to: 360
    reverse: true
    speed: 96

  # --- circle — pan and tilt a quarter cycle apart ---------------------------
  #
  # The quarter-cycle offset between the two axes is what makes the shape a
  # circle rather than a line, and it is carried by the PATTERN KIND, not by a
  # field: the schema holds one phase axis for the whole entry, and spec.md §A
  # defines `circle` as the two axes 90 degrees apart. phase_from below is the
  # base the offset is measured from.
  - fx_id: "circle-soft-ballyhoo"
    display_name: "느린 발리후"
    pattern: "circle"
    aliases: ["발리후", "느린 원", "동그라미", "무빙 돌려줘", "뱅글뱅글", "slow circle"]
    mood_keywords: ["느린", "원형", "발리후", "몽환적인", "부드러운", "도는", "circle", "slow"]
    steps:
      - Pan: -20
        Tilt: -10
      - Pan: 20
        Tilt: 10
    phase_from: 0
    speed: 12

  - fx_id: "circle-club-wings"
    display_name: "미러 서클"
    pattern: "circle"
    aliases: ["미러 서클", "좌우 대칭 원", "빠른 원", "양쪽에서 돌게", "대칭으로 돌려", "mirror circle"]
    mood_keywords: ["빠른", "대칭", "화려한", "클럽", "원형", "미러", "fast", "mirror"]
    steps:
      - Pan: -25
        Tilt: -12
      - Pan: 25
        Tilt: 12
    phase_from: 0
    speed: 112
    x_wings: 2

  # --- diagonal — pan and tilt in step, or against each other ----------------
  #
  # The in-phase and anti-phase forms are authored as STEP VALUES, not as a
  # phase field: both axes travelling the same way is a diagonal, both axes
  # travelling opposite ways is the crossing diagonal. That is the SPEC's own
  # rule applied — amplitude, and here direction too, live in the difference
  # between step values.
  - fx_id: "diagonal-soft-inphase"
    display_name: "부드러운 대각선"
    pattern: "diagonal"
    aliases: ["대각선", "사선", "비스듬히", "사선으로 쓸어줘", "soft diagonal"]
    mood_keywords: ["부드러운", "느린", "대각선", "사선", "잔잔한", "diagonal", "slow"]
    steps:
      - Pan: -28
        Tilt: -14
      - Pan: 28
        Tilt: 14
    phase_from: 0
    speed: 16

  - fx_id: "diagonal-club-cross"
    display_name: "교차 대각선"
    pattern: "diagonal"
    aliases: ["교차 대각선", "엇갈린 사선", "엑스자", "엇갈리게 쳐줘", "cross diagonal"]
    mood_keywords: ["빠른", "교차", "날카로운", "클럽", "엇갈리는", "cross", "fast"]
    steps:
      - Pan: -22
        Tilt: 14
      - Pan: 22
        Tilt: -14
    phase_from: 0
    speed: 104
    x: 2

  # --- entries below entered on the 2026-08-15 live session ------------------

  # V2 transcribed: relative step values ride on top of whatever base look is
  # active, so the same entry sweeps around ANY position preset — the "circle
  # around a position" family the absolute entries above cannot express.
  - fx_id: "sweep-relative-center"
    display_name: "제자리 스윕"
    pattern: "sweep"
    aliases: ["제자리 스윕", "현재 위치 스윕", "상대 스윕", "포지션 그대로 흔들어", "지금 위치에서 살짝", "relative sweep"]
    mood_keywords: ["현재", "제자리", "유지하면서", "부드러운", "포지션", "그대로", "relative", "center"]
    steps:
      - Pan: -15
      - Pan: 15
    relative: true
    phase_from: 0
    phase_to: 360
    speed: 18

  # A relative circle: both axes offset around the CURRENT aim, a quarter cycle
  # apart (the circle pattern's own offset rule). Small magnitudes on purpose —
  # the swing rides on top of a base position that may already be near a limit.
  - fx_id: "circle-relative-orbit"
    display_name: "제자리 서클"
    pattern: "circle"
    aliases: ["제자리 서클", "현재 위치 원", "궤도", "제자리에서 돌려줘", "포지션 그대로 돌려", "relative circle", "orbit"]
    mood_keywords: ["제자리", "원형", "궤도", "몽환적인", "유지", "그대로", "orbit", "relative"]
    steps:
      - Pan: -12
        Tilt: -8
      - Pan: 12
        Tilt: 8
    relative: true
    phase_from: 0
    speed: 14

  # V1's curve on the position axes: accel/decel -100 rounds the turnaround so
  # the sweep eases in and out instead of bouncing off its endpoints.
  - fx_id: "sweep-sine-ease"
    display_name: "이지 스윕"
    pattern: "sweep"
    aliases: ["이지 스윕", "부드럽게 도는 스윕", "사인 스윕", "스르륵 갔다 오는", "eased sweep"]
    mood_keywords: ["부드러운", "우아한", "느린", "유려한", "고급스러운", "매끄러운", "ease", "sine", "elegant"]
    steps:
      - Pan: -26
      - Pan: 26
    accel: -100
    decel: -100
    phase_from: 0
    phase_to: 360
    speed: 12

  # --- entries below entered from card t370 (docs/research/ma3-effects/17-fei-hu-ma2-video-patterns.md §6/§9) ------
  #
  # Three of the twelve candidates that document lists, chosen because they are
  # the ones its own §9 names "relatively safe" — Pan/Tilt/Dimmer only, no beam
  # attribute (Prism/Gobo/Iris/Zoom), so nothing here waits on the profile
  # verification layer §5.5 says a beam entry would need. The rig's own beam
  # coverage is thin (measured 2026-09-13: Iris on 3 of 15 fixture types, Zoom
  # on 9, Frost on 5 — reports/onsite-round-20260912/rig-beam-axes.txt), which
  # is a second, independent reason to stay off that family here.
  #
  # None of the three below has been fired on the real console — that firing is
  # the operator's own next step, not this commit's. Each still follows the
  # authoring rules above the header: two steps, one attribute set, no repeated
  # value, and every modifier axis actually reads back in the bundle this file
  # builds (a declared-but-silent axis is exactly the M0 failure mode the
  # module header warns about).
  #
  # PATTERN CHOICE, NOT JUST NAMING. `pattern` here is `chase` rather than
  # `sweep` for the first two: `resolve_pattern` (matching.py) treats the bare
  # word 체이스 as a hard pattern-axis word, so any query naming it narrows the
  # candidate set to `pattern: chase` entries ONLY — an entry that answers to
  # 체이스 in its alias but is filed under a different pattern is invisible to
  # that query no matter what else its alias says. `chase` is one attribute
  # kind the schema already allows any attribute set under (color.yaml already
  # runs it on ColorRGB); running it on Pan is the same mechanism, not a new
  # one. `server/tests/test_scene_matching.py` also expects every fx_id to
  # carry its OWN pattern as a hyphen-separated token, which is why the
  # doc's own candidate ids gain a leading pattern-name token below.

  # chase-horizontal — a Pan spread across the SELECTION, the same mechanism
  # `sweep-club-xwave` above already proves: one attribute plus a phase pair
  # walks the selection order end to end rather than swinging every fixture in
  # place. The X-axis MAtricks form is the doc's own note ("기존 phase_from_x/
  # to_x 활용 가능").
  - fx_id: "chase-horizontal"
    display_name: "수평 체이스"
    pattern: "chase"
    aliases: ["수평 체이스", "좌우로 달리게", "가로 체이스", "옆으로 흘러가게", "가로로 훑어줘", "horizontal chase"]
    mood_keywords: ["빠른", "달리는", "이동하는", "역동적인", "club"]
    steps:
      - Pan: -25
      - Pan: 25
    phase_from_x: 0
    phase_to_x: 360
    speed: 108

  # chase-bounce-run — the reverse axis rides on the MAIN phase pair (not an
  # X-axis one, unlike the entry above), because `reverse` only flips the main
  # `phase_to` sign; declaring it next to `phase_from_x`/`phase_to_x` alone
  # would leave it unread and silent. `x_wings` supplies the doc's "wings"
  # half of the combination: two mirrored groups, each running the same
  # reversed spread.
  - fx_id: "chase-bounce-run"
    display_name: "바운스 런 체이스"
    pattern: "chase"
    aliases: ["바운스 체이스", "런 이펙트", "통통 튀게", "바운스 런", "bounce chase", "run effect"]
    mood_keywords: ["통통 튀는", "탄력있는", "리드미컬한", "역동적인", "club", "bounce"]
    steps:
      - Pan: -32
      - Pan: 32
    phase_from: 0
    phase_to: 360
    reverse: true
    x_wings: 2
    speed: 132

  # sweep-vshape-swing — small `relative` steps ride on top of whatever base
  # aim is already live (the doc's "center aim 필요"), and `x_wings: 2` splits
  # the selection into a mirrored left/right pair so the two halves open
  # outward and close again in step — the V shape. Same two mechanisms
  # `sweep-relative-center` and `circle-club-wings` above already prove on
  # their own; this entry is their combination. Left on `sweep` (not `chase`):
  # its own alias "좌우 대칭 스윙" already names the `sweep` pattern-axis word
  # 좌우, so filing it under `chase` would make its own alias contradict its
  # own pattern.
  - fx_id: "sweep-vshape-swing"
    display_name: "V자 팬 스윙"
    pattern: "sweep"
    aliases: ["V자로 흔들어", "대칭 팬 스윙", "브이자 스윙", "좌우 대칭 스윙", "양쪽으로 벌어지게", "v-shape swing"]
    mood_keywords: ["대칭", "우아한", "느린", "스윙", "symmetric", "elegant"]
    steps:
      - Pan: -18
      - Pan: 18
    relative: true
    x_wings: 2
    speed: 16
