# Built-in fx library — intensity phasers (REQ-FXLIB-002).
#
# This file holds the only pattern whose effect was directly observed. M0 built
# a two-step intensity phaser on a live console, stored it, emptied the
# programmer and watched the stored object run (progress.md §E.2) — one
# observation proving both that the phaser was created and that the store
# captured it.
#
# `pulse-beat` below IS that measurement, transcribed. Its numbers are a
# regression baseline rather than a taste decision: M4 has to render a bundle
# from this entry that matches the measured shape string for string
# (AC-FXLIB-008), so changing them changes what the word "measured" refers to
# everywhere else in this SPEC.
#
# See movement.yaml for the authoring rules shared by every asset here.
#
# WHY THERE IS NO FAST FULL-RANGE ENTRY. An intensity phaser slamming zero to
# full at club tempo is a flash effect in everything but the attribute name, and
# that family is out of scope (spec.md §D — the preview classifier rates it a
# direct risk to audience and camera). The second entry is a slow breath
# instead, and the fast band is served by the movement and colour patterns.
schema_version: 1

fx:
  - fx_id: "pulse-beat"
    display_name: "박자 펄스"
    pattern: "pulse"
    aliases: ["펄스", "박자 펄스", "깜빡이는 딤머", "pulse"]
    mood_keywords: ["박자", "깜빡이는", "리듬", "펄스", "또렷한", "pulse", "beat"]
    steps:
      - Dimmer: 100
      - Dimmer: 0
    phase_from: 0
    phase_to: 360
    speed: 60

  - fx_id: "pulse-breath"
    display_name: "숨쉬는 딤머"
    pattern: "pulse"
    aliases: ["숨쉬는 딤머", "브리딩", "느린 펄스", "breathing"]
    mood_keywords: ["숨쉬는", "느린", "따뜻한", "잔잔한", "발라드", "breath", "slow"]
    steps:
      - Dimmer: 25
      - Dimmer: 75
    phase_from: 0
    phase_to: 360
    speed: 14

  # --- entries below entered on the 2026-08-15 live session ------------------
  #
  # Each rides ONLY axes whose effect was confirmed on stage that day
  # (SPEC-COPILOT-FXGEN-001 spec.md §A): the accel/decel sine curve
  # (V1), width + measure step timing (V4), and the SpeedMaster binding (V3).

  # V1 transcribed: the measured sine shape itself (10/90, curves -100/-100).
  # Speed differs from the probe's 30 BPM only to keep this entry's lines from
  # colliding with a neighbouring instantiation in one instruction turn.
  - fx_id: "pulse-sine-breath"
    display_name: "사인 브리딩"
    aliases: ["사인 브리딩", "부드러운 숨쉬기", "사인파 딤머", "sine breathing"]
    mood_keywords: ["부드러운", "유기적인", "숨쉬는", "몽환적인", "발라드", "sine", "smooth", "organic"]
    pattern: "pulse"
    steps:
      - Dimmer: 10
      - Dimmer: 90
    accel: -100
    decel: -100
    phase_from: 0
    phase_to: 360
    speed: 16

  # V4 transcribed: a narrow pulse (width 25) on a 4-beat loop (measure 4).
  # Still a pulse, not a flash: the floor stays lit and the tempo is musical.
  - fx_id: "pulse-snap"
    display_name: "스냅 펄스"
    aliases: ["스냅 펄스", "짧은 펄스", "튀는 딤머", "snap pulse"]
    mood_keywords: ["짧은", "튀는", "긴장감", "임팩트", "리듬", "snap", "punchy"]
    pattern: "pulse"
    steps:
      - Dimmer: 5
      - Dimmer: 95
    width: 25
    measure: 4
    phase_from: 0
    phase_to: 360
    speed: 90

  # V3 transcribed: no fixed BPM — the phaser follows Speed Master 1 live, so
  # the operator (or a tempo tool) retunes every bound effect from one fader.
  - fx_id: "pulse-master-sync"
    display_name: "마스터 동기 펄스"
    aliases: ["마스터 동기 펄스", "템포 동기 딤머", "스피드마스터 펄스", "master sync pulse"]
    mood_keywords: ["동기화", "템포", "라이브", "박자", "마스터", "sync", "tempo", "live"]
    pattern: "pulse"
    steps:
      - Dimmer: 15
      - Dimmer: 85
    phase_from: 0
    phase_to: 360
    speed_master: 1
