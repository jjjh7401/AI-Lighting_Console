# LOVE ATTACK 연출 프리셋 계획 주석 — SPEC-LDRHYTHM-001 stage 2.
#
# 격자 칸(love_attack.yaml)의 색·방향은 라벨 글자로만 적혀 있어 구조화된
# 필드가 없다. 칸 → 색·방향 대응은 여기서 한 번만 적고, 계획 코드
# (server/design/love_attack_presets.py)는 이 파일만 읽는다 — 라벨 글자를
# 파싱하지 않는다. 디머 %는 칸의 brightness.value_percent 에서 바로 온다.
#
# 출처: reports/effect-arrangement-rules-20261007.md §3·§4 와 love_attack.yaml
# 칸 라벨. 적지 않은 값은 지어내지 않는다(미정). 앱이 기본값을 쓴 곳은 「감독이 고칠 값」으로
# 계획 화면에 그대로 드러난다.

# 색 — rgb 가 null 이면 색 이름을 표준 팔레트에서 찾는다(color_names.resolve_color_name).
# rgb 를 적으면 그 값(세 채널, 각 0~100 — 콘솔 퍼센트)을 쓴다. 이 곡에서 앱이 고른 값은 전부
# director_tunable: true 로 표시하고, 계획 화면에서 「감독이 고칠 값」으로 드러난다.
# 표준 팔레트에 없는 이름은 「미정」으로 남는다. console_name 은 콘솔에 들어갈 영문 이름(ASCII)이고
# 색 이름의 번역이 아니다.
#
# 칸 — cells 가 비어 있는 색은 「칸 미정」이다: 번호를 잡지 않고 계획표에 자리표시로만 낸다(규칙 문서 §5
# 「색 자리표시」). SCENE 메모의 색을 트랙 칸에 붙이는 일은 칸 배정 규칙(세 조건)이 막는다 — 붙이려면
# 감독이 그 배정을 정해야 한다.
colors:
  - name: 라벤더
    console_name: LAVENDER
    rgb: null
    note: >-
      「라벤더」는 색 표(server/design/color_names.py)에서 표준 팔레트 Lavender(55,35,100)
      슬롯을 가리키도록 이었다(카드 2단계, 2026-10-15) — 값을 새로 짓지 않았다. 「퍼플/보라」의
      감독 판정(t409)과 같은 슬롯이다. 감독이 고칠 값: 실기 라벤더가 다르면 색 표에서 바꾼다.
      워시 14마디(25% 덜어냄)는 같은 워시라 같은 색으로 본다 — 이것도 감독이 고칠 값이다.
      드롭 앞 갈라짐(63마디, 왼쪽 절반)은 0~25마디 격자 밖이라 아직 칸에 없다(칸 미정).
    cells:
      - {group_name: WASH-ALL, bar: 7}
      - {group_name: WASH-ALL, bar: 14}

  - name: 하늘
    console_name: SKY
    rgb: [40, 65, 95]
    director_tunable: true
    note: >-
      역광(BACK)의 차가운 실루엣 — 규칙 문서 §4 0~2마디 「BACK 차가운 실루엣 30%」. 인트로는 에너지가
      가장 낮아 채도를 낮춘 파스텔로 두었다. 시안의 하늘색 값을 옮기지 않고 이 곡 구간에 맞춰 정했다.
      칸 미정: 이 값은 SCENE 메모(0마디)이고, 0마디 BACK 에는 이미 펄스 큐가 있어 칸 배정 규칙이 막는다.
      감독이 고칠 값: 실기 역광 색이 다르면 rgb 를 고친다. 칸은 감독이 정한다.
    cells: []

  - name: 핑크
    console_name: PINK
    rgb: [100, 50, 75]
    director_tunable: true
    note: >-
      후렴 1(18마디 「핑크 70% 끊어 바꿈」)의 워시 색이다. 후렴은 이 곡에서 에너지가 가장 높지만 워시는
      넓게 쓰므로(규칙 1·8) 진한 원색 대신 채도를 낮춘 핑크로 두었다. 드롭 앞 갈라짐(63마디 오른쪽 절반)의
      색이기도 하다.
      칸 미정: 18·22마디 워시 값은 SCENE 메모(칸이 그룹을 부르지 않아 배정 미정)이고, 63마디는 격자 밖이다.
      감독이 고칠 값: 실기 핑크가 다르면 rgb 를 고친다. 칸은 감독이 정한다.
    cells: []

  - name: 피치
    console_name: PITCH
    rgb: [100, 75, 60]
    director_tunable: true
    note: >-
      후렴 1 뒤(22마디 「핑크→피치 1마디 번짐」)의 도착 색이다. 에너지가 내려가는 자리라 따뜻한 중간색을 골랐다.
      칸 미정: 22마디 워시 값은 SCENE 메모(칸이 그룹을 부르지 않아 배정 미정)다.
      감독이 고칠 값: 실기 피치가 다르면 rgb 를 고친다. 칸은 감독이 정한다.
    cells: []

# 위치 방향 — 목표 좌표 표는 없다. 방향마다 대략 목표를 target 에 적는다(감독이 콘솔에서 고칠 값).
# 「바닥 쪽」 = 무대 중앙 깊이의 바닥점(장비 x 유지 · y=cy · z=0). 근거: 보고서
# .moai/reports/t221/verdict.md 의 POS.04 정의(각 장비 x · y=cy · z=0).
directions:
  - name: 바닥 쪽
    console_name: FLOOR
    target: "무대 중앙 깊이 바닥 (장비 x 유지 · y=cy · z=0)"
    cells:
      - {group_name: MOVER-U, bar: 0}
      - {group_name: MOVER-D, bar: 0}

# 칸 글자는 있으나 프리셋 하나로 만들 수 없는 위치(상대 이동·새 자리) — 이번 계획에서 제외하고
# 사유를 승인 카드에 적는다.
relative_position_cells:
  - {group_name: MOVER-U, bar: 3, label: "5마디 1박 위치 한 칸 올림"}
  - {group_name: MOVER-D, bar: 3, label: "5마디 1박 위치 한 칸 올림"}
  - {group_name: MOVER-D, bar: 11, label: "11마디 1박 새 자리, 정지"}
