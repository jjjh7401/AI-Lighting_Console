# 실기 콘솔에서 잰 구조 한계 (카드 t553 → WT-track-model, REQ-LDBEAT-001 M1 ①).
# 숫자는 코드 상수가 아니라 이 파일에 근거와 함께 산다 — 다른 콘솔·쇼에서
# 더 재면 이 값과 source 만 고친다. beat_grid_emit 은 한 타임코드에 이 값을 넘는
# 줄이 몰리면 **넘친 줄만** 이유와 함께 보내지 않는다(나머지는 보낸다).
max_timecode_tracks: 16
source: >-
  2026-10-18 실기(grandMA3 onPC 127.0.0.1:8000, 카드 WT-track-model, 사용자·리드 허용) —
  빈 타임코드 33 을 만들고 기존 시험 시퀀스 210, 219~233(16개)을 트랙 16개로 Assign 한 뒤
  되읽기: Timecodes/33/1 childCount 17(Marker 1 + Track 16), Track TARGET 이
  Sequence 210, 219..233 순서와 일치 → PASS. 재생(Go)은 하지 않았다. 측정 뒤 TC33 을 지우고
  타임코드·시퀀스 목록이 측정 전과 같음을 되읽어 확인했다.
  근거 .moai/reports/WT-track-model/live/ (readback-after-assign.json, readback-after-cleanup.json,
  free.json·free-after.json, approvals-denyall-cards.json, steps-*.jsonl).
  이전 값 8 은 t553(2026-10-11, 타임코드 32, 트랙 8)·그 전 6 은 t531(타임코드 30, 트랙 6) 측정이었다.
  16 보다 많은 트랙은 아직 안 쟀다 — 줄이 더 많으면 앱이 다음 타임코드에 나눠 담는다
  (server/design/timecode_split.py, 카드 WT-track-model PR2).
# 줄을 나눠 담을 때 **쓰지 않을** 타임코드 번호(리드 지시 2026-10-18 — 감독 쇼의 TC3·4).
# 비어 있어도 고르지 않는다. 다른 쇼에서는 이 목록만 고친다.
reserved_timecodes: [3, 4]
reserved_timecodes_source: >-
  리드 지시 2026-10-18(카드 WT-track-model PR2) 「나눌 타임코드 번호는 TC3/4를 피해 비어 있는 것만
  쓰고, 그 규칙을 코드에 넣어 주세요」. 실측 시험에서도 늘 「TC3·4는 건드리지 않는다」가 조건이었다.
