# 카드 t537 ② — 리드 지시(2026-10-10): SCENE 열 값은 역할·효과 혼성이라
# 트랙으로 못 옮긴다(SCENE 자체가 카드 t526에서 철회된 이름). 아래 "두 조건
# 모두" 규칙(§4 칸이 그룹을 직접 이름 부르고 그 그룹 번호가 이미 above
# tracks에 확인돼 있을 때만 그 트랙에 얹는다, 같은 칸에 이미 있는 큐와
# 충돌하면 그래도 메모)을 2026-10-10 전수 재검토한 결과 — 여섯 값 전부가
# 이 메모로 떨어진다: BACK(bar 0)은 그룹 번호가 확인돼 있지만 그 마디에
# 이미 펄스 큐("앞박 1회")가 있어 충돌 → 메모. WASH·FOH는 이름이 §4 칸에
# 나오지만 이 파일의 tracks에 그 그룹 번호가 확인돼 있지 않다(트랙 자체가
# 없다) → 메모. 나머지 셋(11~13·18~21·22~25)은 칸 자체가 그룹 이름을
# 부르지 않는다 → 메모. 추측(지어낸 그룹 배정)은 0건이다.
