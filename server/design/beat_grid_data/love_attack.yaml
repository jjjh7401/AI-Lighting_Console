# LOVE ATTACK 곡의 0~25마디 박자 격자 첫 기본값 — 순수 데이터 파일.
#
# 카드 t537(감독 결정 "리그·곡이 바뀌어도 동작해야 한다", 2026-10-10) —
# 이 리그·이 곡에만 맞는 값(그룹 번호·그룹 이름·트랙 구성·§4 전사값)은
# 전부 이 파일 하나에만 산다. `server/design/beat_grid.py`의 로더(
# `default_beat_grid`/`_build_track_from_data`/`normalize_beat_grid_cue`)는
# 이 파일의 내용을 몰라도 되는 일반 코드다 — 다른 곡·다른 리그의 기본값은
# 같은 스키마의 새 YAML 파일 하나와 레지스트리 한 줄만 추가하면 된다.
#
# 값의 출처: 배치 규칙서 §2(역할별 시퀀스의 그룹 칸)·§4(0~25마디 격자,
# `reports/effect-arrangement-rules-20261007.md:98-115`), 그룹 번호는
# 배치 규칙서 §2가 직접 적은 숫자 그대로이거나(BACK·SIDE-ALL·MOVER-U·
# MOVER-D) `.moai/reports/t525/verdict.md` §②가 실측한 값(BLIND=14).
# STROBE는 이 plan-phase 증거 어디에도 그룹 번호가 없어 비워 둔다(지어내지
# 않음).
#
# 프리셋 **번호**(브라이트니스 디머·디머 효과 프리셋, position_preset_no,
# color_preset_no, effect_preset_no)는 §4에 숫자가 전혀 없으므로(REQ-LDBEAT-
# 015(f)) 모든 큐에서 비워 둔다(이 파일에 아예 적지 않으면 로더가 `None`
# 으로 채운다) — `reports/ldbeat-runbook-ui-proposal-20261008.html`의 `P`
# 객체 번호는 그 시안 자신이 지어낸 예시일 뿐 배치 규칙서의 출처가
# 아니므로 베끼지 않는다.
source: love_attack_default
