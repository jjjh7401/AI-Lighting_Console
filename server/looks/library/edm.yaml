# Built-in look library — EDM (REQ-LOOKLIB-002).
#
# See worship.yaml for the shared authoring rules (full RGB always, roles never
# numbers, 움직임은 §6.4 가 정한 자리에만, percent values).
#
# 움직임이 가장 많은 장르다 — 열 중 일곱. 이 장르만 세 대역을 전부 쓴다: 인트로·그루브·
# 빌드·라이저가 느림, 텐션(`edm-drop-acid`, D4)이 중속, 드롭 둘(D5)이 빠름.
# §6.4 의 「빠름 = 드롭 전용」이 여기서만 참이 되는 이유는 이 장르에만 드롭이 있기
# 때문이다. 정지로 남긴 셋에도 사유가 있다 — D1 둘은 대역이 정지이고,
# `edm-breakdown-deep` 은 §6 표가 브레이크다운을 「무빙·이펙트 정지」로 적기 때문이다.
# 숨을 고르는 구간에서 빔이 계속 돌면 다음 드롭이 올라갈 자리가 없다.
#
# WHAT AN EDM SET NEEDS: a build and a drop, and the drop has to feel like a
# different room than the build did. Ten looks, weighted toward the top of the
# scale — three at dynamics 4-5, because a set plays several drops and they
# should not all be the same colour.
#
# THE BUILD NARROWS, THE DROP OPENS. Optics carry the tension here: the riser
# closes the iris toward a pin while intensity climbs, and the drop throws it
# fully open on the beat. That contrast is the mechanism; the colour change
# alone does not land it.
#
# STROBE-FAMILY EFFECTS ARE OUT OF SCOPE (spec.md §D) — the preview classifier
# rates them dangerous, so the drops here are built from intensity, saturation
# and beam width instead. That is a real constraint on this genre and it is
# worth knowing it was a decision rather than an omission.
#
# 블라인더·스트로브는 카드 t379 에서도 안 붙였다 — 역할 어휘엔 이미 있다(roles.py,
# 카드 t356). 안 붙인 이유는 두 갈래다. (1) 정본 §7.1 아껴두기 사다리가 그 둘을
# **회차 트리거형**으로 못박는다 — 블라인더는 코러스 3(마지막)에만, 스트로브는
# 앙코르·피날레까지 보류. Look 이 담는 것은 (장르, 다이내믹스) 정적 값 하나뿐이라
# "몇 번째 코러스인가"를 모르고, 그 축이 없는 채로 정적 룩에 붙이면 그 룩이 뽑힐
# 때마다 매번 발화해 사다리의 전제(회차마다 하나씩만 더한다)를 정면으로 깬다.
# (2) `server/web/preview.py:130-139` 가 strobe 계열(Hz 표기 포함)과 blinder/
# audience 패턴을 **danger** 로 분류한다 — 실측(grep) 확인. 정적 룩에 박으면 그 룩이 뽑힐
# 때마다 danger 경고가 뜨는데, 회차형 액센트는 오퍼레이터가 그 순간에만 확인하고
# 켜는 것이 맞다. 회차 사다리(§7.1)를 룩에 값으로 새기는 일 자체가 카드 t378 의
# 몫이고, 여기서는 하지 않는다 — "룩 하나 = 정적 값 하나" 스키마를 벗어나는 기능은
# 이 자산 파일이 아니라 그 로직이 담을 자리다.
#
# 프론트 appears in only one look. The audience faces a booth, not a portrait;
# lighting the operator flat is neither wanted nor flattering. The exception is
# the breakdown, where the crowd should be able to see who is up there.
schema_version: 1

looks:
  # --- dynamics 1-2: the bed ------------------------------------------------
  - look_id: "edm-ambient-hold"
    display_name: "앰비언트 홀드"
    genre: "edm"
    dynamics: 1
    roles: ["배경"]
    aliases: ["앰비언트 홀드", "ambient hold", "대기"]
    mood_keywords: ["어두운", "차가운", "대기", "정적", "ambient", "hold"]
    attributes:
      Dimmer: 20
      ColorRGB_R: 0
      ColorRGB_G: 55
      ColorRGB_B: 70

  - look_id: "edm-intro-bed"
    display_name: "인트로 베드"
    genre: "edm"
    dynamics: 2
    roles: ["배경", "탑", "무버"]
    aliases: ["인트로 베드", "intro bed", "보라 인트로"]
    mood_keywords: ["보랏빛", "낮은", "인트로", "잠잠한", "violet", "intro"]
    attributes:
      Dimmer: 45
      ColorRGB_R: 55
      ColorRGB_G: 12
      ColorRGB_B: 100
    movement:
      - attribute: "Pan"
        phase_from: 0
        phase_to: 360
        relative: 12
        speed: 12

  - look_id: "edm-groove-cyan"
    display_name: "그루브 시안"
    genre: "edm"
    dynamics: 2
    roles: ["사이드", "백라이트", "무버"]
    aliases: ["그루브 시안", "groove cyan", "청록 그루브"]
    mood_keywords: ["시원한", "청록", "그루브", "일렁이는", "cyan", "groove"]
    attributes:
      Dimmer: 55
      ColorRGB_R: 0
      ColorRGB_G: 92
      ColorRGB_B: 100
    movement:
      - attribute: "Pan"
        phase_from: 0
        phase_to: 360
        relative: 18
        speed: 16

  - look_id: "edm-breakdown-deep"
    display_name: "브레이크다운"
    genre: "edm"
    dynamics: 2
    # The one look with 프론트 — see the header note.
    roles: ["배경", "프론트"]
    aliases: ["브레이크다운", "breakdown", "깊은 파랑"]
    mood_keywords: ["깊은", "푸른", "파란", "숨고르는", "브레이크다운", "deep", "breakdown"]
    attributes:
      Dimmer: 42
      ColorRGB_R: 12
      ColorRGB_G: 25
      ColorRGB_B: 85

  # --- dynamics 3: the build ------------------------------------------------
  - look_id: "edm-build-magenta"
    display_name: "빌드 마젠타"
    genre: "edm"
    dynamics: 3
    roles: ["백라이트", "사이드", "탑", "무버"]
    aliases: ["빌드 마젠타", "build magenta", "고조"]
    mood_keywords: ["고조되는", "마젠타", "긴장되는", "빌드업", "building", "tense"]
    attributes:
      Dimmer: 72
      ColorRGB_R: 100
      ColorRGB_G: 0
      ColorRGB_B: 85
      Zoom: 35
    movement:
      - attribute: "Pan"
        phase_from: 0
        relative: 16
        speed: 18
      - attribute: "Tilt"
        phase_from: 0
        relative: 8
        speed: 18

  - look_id: "edm-riser-white"
    display_name: "라이저 화이트"
    genre: "edm"
    dynamics: 3
    # Iris closing toward a pin while intensity climbs — the tension mechanism.
    roles: ["백라이트", "탑", "배경", "무버"]
    aliases: ["라이저", "riser white", "직전"]
    mood_keywords: ["조여드는", "새하얀", "직전", "라이저", "riser", "tightening"]
    attributes:
      Dimmer: 78
      ColorRGB_R: 100
      ColorRGB_G: 100
      ColorRGB_B: 100
      Iris: 38
      Zoom: 20
    movement:
      - attribute: "Tilt"
        phase_from: 0
        phase_to: 360
        relative: 10
        speed: 20

  # --- dynamics 4-5: the drops ---------------------------------------------
  - look_id: "edm-drop-acid"
    display_name: "드랍 애시드"
    genre: "edm"
    dynamics: 4
    roles: ["백라이트", "사이드", "탑", "배경", "무버"]
    aliases: ["드랍 애시드", "drop acid", "형광 드랍"]
    mood_keywords: ["형광", "쏘는", "노랑초록", "드랍", "acid", "drop"]
    attributes:
      Dimmer: 90
      ColorRGB_R: 72
      ColorRGB_G: 100
      ColorRGB_B: 0
      Zoom: 18
    movement:
      - attribute: "Pan"
        phase_from: 0
        phase_to: 360
        relative: 24
        speed: 40

  - look_id: "edm-drop-crimson"
    display_name: "드랍 크림슨"
    genre: "edm"
    dynamics: 5
    # 워시 — 카드 t379. 정본 §7.1 「chorus 1 기준 룩 — 백라이트 + 워시」가 이름 붙인
    # 조합 그대로다. 실측(reports/onsite-round-20260912/diag.py)에서 실제 곡의
    # Chorus 구간이 가장 많이 고른 룩이 이 룩이라, 여기 붙여야 WASH-U/WASH-D/
    # WASH-ALL 이 실제로 값을 받는다 — 다른 룩에 붙이면 문면은 맞아도 리그가 안
    # 켜진다.
    roles: ["백라이트", "프론트", "사이드", "탑", "배경", "스페셜", "무버", "워시"]
    aliases: ["드랍 크림슨", "drop crimson", "붉은 드랍"]
    mood_keywords: ["새빨간", "압도적인", "드랍", "절정", "crimson", "drop"]
    attributes:
      Dimmer: 100
      ColorRGB_R: 100
      ColorRGB_G: 0
      ColorRGB_B: 15
      Zoom: 10
    movement:
      - attribute: "Pan"
        phase_from: 0
        relative: 28
        speed: 96
      - attribute: "Tilt"
        phase_from: 0
        relative: 14
        speed: 96

  - look_id: "edm-drop-beams"
    display_name: "드랍 빔"
    genre: "edm"
    dynamics: 5
    # The tightest look in the library. Iris fully open, beams at their
    # narrowest: hard shafts rather than a wash.
    #
    # 헤이즈 — 카드 t379. 정본 §6.2 「헤이즈는 빔을 보이게 하는 필수 요소」가
    # 정확히 이 룩을 가리킨다 — 이름 자체가 "샤프트"이고 위 주석이 이미 "워시가
    # 아니라 샤프트"라고 못박아 뒀다. 헤이즈 없이는 그 샤프트가 안 보인다.
    roles: ["백라이트", "사이드", "탑", "무버", "헤이즈"]
    aliases: ["드랍 빔", "drop beams", "빔 드랍"]
    mood_keywords: ["날카로운", "차가운", "쏟아지는", "드랍", "빔", "beams", "hard"]
    attributes:
      Dimmer: 100
      ColorRGB_R: 70
      ColorRGB_G: 88
      ColorRGB_B: 100
      Iris: 100
      Zoom: 5
    movement:
      - attribute: "Pan"
        phase_from: 0
        phase_to: 360
        relative: 30
        speed: 120

  # --- dynamics 1, 뒤늦게 붙인 칸: 배경막 없는 리그를 위한 것 -----------------
  # 파일이 다이내믹스 오름차순으로 읽히는 흐름에서 여기만 어긋난다. 정렬은
  # `looks_for_genre` 가 `(dynamics, look_id)` 로 하므로 파일 위치는 선택에
  # 영향을 주지 않고, 이 자리에 붙이는 이유는 승인 게이트 쪽이다(옛 EOF 뒤의
  # 순수 삽입이라 위쪽 줄이 한 줄도 밀리지 않는다).
  #
  # `edm-ambient-hold` 는 역할이 `배경` 하나뿐이라, 호리·cyc 계열이 없는 리그에서는
  # 어느 무리에도 안 묶이고 그 구간이 통째로 침묵했다. 배경막이 없을 때 깊이를
  # 만드는 빛은 뒤에서 오는 것뿐이므로 역할은 `백라이트` 다 — 헤더 규칙이 `프론트` 를
  # 배제하고, `탑` 은 실기 리그에서 안 묶인다.
  - look_id: "edm-haze-shafts"
    display_name: "헤이즈 샤프트"
    genre: "edm"
    dynamics: 1
    roles: ["백라이트"]
    aliases: ["헤이즈 샤프트", "haze shafts", "빈 하늘"]
    mood_keywords: ["어두운", "깊은", "푸른", "파란", "잠긴", "haze", "shafts"]
    attributes:
      Dimmer: 18
      ColorRGB_R: 0
      ColorRGB_G: 40
      ColorRGB_B: 78
