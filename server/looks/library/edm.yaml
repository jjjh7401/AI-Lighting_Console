# Built-in look library — EDM (REQ-LOOKLIB-002).
#
# See worship.yaml for the shared authoring rules (full RGB always, roles never
# numbers, no movement, percent values).
#
# WHAT AN EDM SET NEEDS: a build and a drop, and the drop has to feel like a
# different room than the build did. Nine looks, weighted toward the top of the
# scale — three at dynamics 4-5, because a set plays several drops and they
# should not all be the same colour.
#
# THE BUILD NARROWS, THE DROP OPENS. Optics carry the tension here: the riser
# closes the iris toward a pin while intensity climbs, and the drop throws it
# fully open on the beat. That contrast is the mechanism; the colour change
# alone does not land it.
#
# STROBE-FAMILY EFFECTS ARE OUT OF SCOPE (spec.md §D) — the preview classifier
# rates them dangerous, so the drops here are built from intensity, saturation
# and beam width instead. That is a real constraint on this genre and it is
# worth knowing it was a decision rather than an omission.
#
# 프론트 appears in only one look. The audience faces a booth, not a portrait;
# lighting the operator flat is neither wanted nor flattering. The exception is
# the breakdown, where the crowd should be able to see who is up there.
schema_version: 1

looks:
  # --- dynamics 1-2: the bed ------------------------------------------------
  - look_id: "edm-ambient-hold"
    display_name: "앰비언트 홀드"
    genre: "edm"
    dynamics: 1
    roles: ["배경"]
    aliases: ["앰비언트 홀드", "ambient hold", "대기"]
    mood_keywords: ["어두운", "차가운", "대기", "정적", "ambient", "hold"]
    attributes:
      Dimmer: 20
      ColorRGB_R: 0
      ColorRGB_G: 55
      ColorRGB_B: 70

  - look_id: "edm-intro-bed"
    display_name: "인트로 베드"
    genre: "edm"
    dynamics: 2
    roles: ["배경", "탑"]
    aliases: ["인트로 베드", "intro bed", "보라 인트로"]
    mood_keywords: ["보랏빛", "낮은", "인트로", "잠잠한", "violet", "intro"]
    attributes:
