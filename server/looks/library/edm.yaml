  - look_id: "edm-breakdown-deep"
    display_name: "브레이크다운"
    genre: "edm"
    dynamics: 2
    # The one look with 프론트 — see the header note.
    roles: ["배경", "프론트"]
    aliases: ["브레이크다운", "breakdown", "깊은 파랑"]
    mood_keywords: ["깊은", "푸른", "파란", "숨고르는", "브레이크다운", "deep", "breakdown"]
    attributes:
      Dimmer: 42
      ColorRGB_R: 12
      ColorRGB_G: 25
      ColorRGB_B: 85

  # --- dynamics 3: the build ------------------------------------------------
  - look_id: "edm-build-magenta"
    display_name: "빌드 마젠타"
    genre: "edm"
    dynamics: 3
    roles: ["백라이트", "사이드", "탑"]
    aliases: ["빌드 마젠타", "build magenta", "고조"]
    mood_keywords: ["고조되는", "마젠타", "긴장되는", "빌드업", "building", "tense"]
