    dynamics: 3
    # Iris closing toward a pin while intensity climbs — the tension mechanism.
    roles: ["백라이트", "탑", "배경"]
    aliases: ["라이저", "riser white", "직전"]
    mood_keywords: ["조여드는", "새하얀", "직전", "라이저", "riser", "tightening"]
    attributes:
      Dimmer: 78
      ColorRGB_R: 100
      ColorRGB_G: 100
      ColorRGB_B: 100
